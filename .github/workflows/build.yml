name: CI

on:
  pull_request:
  push:
    branches: master

jobs:
  ubuntu-latest-html-tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 1
    - name: Update package lists
      run: sudo apt update
    - name: Install dependencies
      run: |
        sudo apt install -y libfltk1.3-dev libssl-dev libpng-dev libjpeg-dev libwebp-dev libbrotli-dev libcurl4-openssl-dev xvfb x11-apps x11-utils imagemagick
        sudo apt install -y libqjs-dev || sudo apt install -y libquickjs-dev || true

    - name: autogen
      run: ./autogen.sh
    - name: Make install dir
      run: mkdir install build
    - name: configure
      run: cd build && ../configure --prefix=$(readlink -f ../install) --enable-html-tests --enable-js
    - name: make
      run: cd build && make
    - name: make install
      run: cd build && make install
    - name: Copy config to .dillo
      run: |
        mkdir -p ~/.dillo/
        cp install/etc/dillo/* ~/.dillo/
    - name: make check
      run: |
        export DILLOBINDIR=$(readlink -f install/bin)
        cd build && make check || (cat test/html/test-suite.log; false)
        export DILLOBINDIR=
    - name: Check release fits in a floppy disk of 1.44 MB
      run: |
        cd build
        make dist-gzip
        size=$(stat -c %s dillo-*.tar.gz)
        floppy=$((1474560 - 32*1024)) # Leave room for FAT table
        echo "Floppy occupation: $(($size * 100 / $floppy)) %"
        if [ $size -lt $floppy ]; then
          echo 'OK: Fits in floopy disk'
        else
          echo "FAIL: Release size too big: $size / $floppy"
          exit 1
        fi
    - name: make distcheck (with HTML tests)
      run: |
        export DILLOBINDIR=
        mkdir build-distcheck install-distcheck
        cd build-distcheck && ../configure --prefix=$(readlink -f ../install-distcheck) --enable-html-tests --enable-js
        make distcheck DISTCHECK_CONFIGURE_FLAGS="--enable-html-tests --enable-js"

  ubuntu-latest-memory-leaks:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 1
    - name: Update package lists
      run: sudo apt update
    - name: Install dependencies
      run: |
        sudo apt install -y libfltk1.3-dev libssl-dev libpng-dev libjpeg-dev libwebp-dev libbrotli-dev libcurl4-openssl-dev xvfb x11-apps x11-utils imagemagick
        sudo apt install -y libqjs-dev || sudo apt install -y libquickjs-dev || true
    - name: autogen
      run: ./autogen.sh
    - name: Make install dir
      run: mkdir install build
    - name: configure
      run: cd build && ../configure CFLAGS="-fsanitize=address" CXXFLAGS="-fsanitize=address" --prefix=$(readlink -f ../install) --enable-html-tests --enable-js
    - name: make
      run: cd build && make
    - name: make install
      run: cd build && make install
    - name: Copy config to .dillo
      run: |
        mkdir -p ~/.dillo/
        cp install/etc/dillo/* ~/.dillo/
    - name: make check
      run: |
        export DILLOBINDIR=$(readlink -f install/bin)
        cd build && make check || (cat test/html/test-suite.log; false)
        export DILLOBINDIR=

  ubuntu-latest-no-tls:
    needs: ubuntu-latest-html-tests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 1
    - name: Update package lists
      run: sudo apt update
    - name: Install dependencies
      run: |
        sudo apt install -y libfltk1.3-dev libcurl4-openssl-dev
        sudo apt install -y libqjs-dev || sudo apt install -y libquickjs-dev || true
    - name: autogen
      run: ./autogen.sh
    - name: configure
      run: ./configure --disable-tls
    - name: make
      run: make
    - name: make check
      run: make check
    - name: make distcheck
      run: make distcheck

  ubuntu-latest-mbedtls2:
    needs: ubuntu-latest-html-tests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 1
    - name: Update package lists
      run: sudo apt update
    - name: Install dependencies
      run: |
        sudo apt install -y libfltk1.3-dev libmbedtls-dev libcurl4-openssl-dev
        sudo apt install -y libqjs-dev || sudo apt install -y libquickjs-dev || true
    - name: autogen
      run: ./autogen.sh
    - name: configure
      run: ./configure --disable-openssl
    - name: make
      run: make
    - name: make check
      run: make check
    - name: make distcheck
      run: make distcheck

  ubuntu-latest-openssl-3:
    needs: ubuntu-latest-html-tests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 1
    - name: Update package lists
      run: sudo apt update
    - name: Install dependencies
      run: |
        sudo apt install -y libfltk1.3-dev libssl-dev libcurl4-openssl-dev
        sudo apt install -y libqjs-dev || sudo apt install -y libquickjs-dev || true
    - name: autogen
      run: ./autogen.sh
    - name: configure
      run: ./configure --disable-mbedtls
    - name: make
      run: make
    - name: make check
      run: make check
    - name: make distcheck
      run: make distcheck

  ubuntu-latest-with-old-std:
    needs: ubuntu-latest-html-tests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 1
    - name: Update package lists
      run: sudo apt update
    - name: Install dependencies
      run: sudo apt install -y libfltk1.3-dev libssl-dev
    - name: autogen
      run: ./autogen.sh
    - name: configure
      # Make sure we build with the C++11 standard and disable JS (which targets C++17).
      run: ./configure --disable-mbedtls --disable-js CFLAGS="-Werror" CXXFLAGS="-Werror -std=c++11"
    - name: make
      run: make
    - name: make check
      run: make check

  alpine-mbedtls-3_6_0:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: jirutka/setup-alpine@v1
      with:
        branch: v3.20
        packages: >
          build-base
          autoconf
          automake
          fltk-dev
          libpng-dev
          libjpeg-turbo-dev
          libwebp-dev
          mbedtls-dev
          curl-dev
          quickjs-dev
    - run: |
        ./autogen.sh
        ./configure
        make
        make check
      shell: alpine.sh {0}

  macOS-14-openssl-1-1:
    needs: ubuntu-latest-html-tests
    runs-on: macos-14
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 1
    - name: Install dependencies
      run: brew install autoconf automake fltk@1.3 openssl@1.1 quickjs curl
    - name: autogen
      run: ./autogen.sh
    - name: configure
      run: |
        export PATH="/opt/homebrew/opt/fltk@1.3/bin:$PATH"
        export QUICKJS_PREFIX="$(brew --prefix quickjs 2>/dev/null || echo /opt/homebrew/opt/quickjs)"
        export LDFLAGS="-L$(brew --prefix openssl@1.1)/lib -L$QUICKJS_PREFIX/lib/quickjs -L$QUICKJS_PREFIX/lib"
        export CPPFLAGS="-I$(brew --prefix openssl@1.1)/include -I$QUICKJS_PREFIX/include"
        ./configure --disable-mbedtls
    - name: make
      run: make
    - name: make check
      run: make check
    - name: make distcheck
      run: |
        export PATH="/opt/homebrew/opt/fltk@1.3/bin:$PATH"
        export QUICKJS_PREFIX="$(brew --prefix quickjs 2>/dev/null || echo /opt/homebrew/opt/quickjs)"
        export LDFLAGS="-L$(brew --prefix openssl@1.1)/lib -L$QUICKJS_PREFIX/lib/quickjs -L$QUICKJS_PREFIX/lib"
        export CPPFLAGS="-I$(brew --prefix openssl@1.1)/include -I$QUICKJS_PREFIX/include"
        make distcheck

  macOS-14-openssl-3:
    needs: ubuntu-latest-html-tests
    runs-on: macos-14
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 1
    - name: Remove old OpenSSL 1.1
      run: brew uninstall openssl@1.1
    - name: Install dependencies
      run: brew install autoconf automake fltk@1.3 openssl@3 quickjs curl
    - name: autogen
      run: ./autogen.sh
    - name: configure
      run: |
        export PATH="/opt/homebrew/opt/fltk@1.3/bin:$PATH"
        export QUICKJS_PREFIX="$(brew --prefix quickjs 2>/dev/null || echo /opt/homebrew/opt/quickjs)"
        export LDFLAGS="-L$(brew --prefix openssl@3)/lib -L$QUICKJS_PREFIX/lib/quickjs -L$QUICKJS_PREFIX/lib"
        export CPPFLAGS="-I$(brew --prefix openssl@3)/include -I$QUICKJS_PREFIX/include"
        ./configure --disable-mbedtls
    - name: make
      run: make
    - name: make check
      run: make check
    - name: make distcheck
      run: |
        export PATH="/opt/homebrew/opt/fltk@1.3/bin:$PATH"
        export QUICKJS_PREFIX="$(brew --prefix quickjs 2>/dev/null || echo /opt/homebrew/opt/quickjs)"
        export LDFLAGS="-L$(brew --prefix openssl@3)/lib -L$QUICKJS_PREFIX/lib/quickjs -L$QUICKJS_PREFIX/lib"
        export CPPFLAGS="-I$(brew --prefix openssl@3)/include -I$QUICKJS_PREFIX/include"
        make distcheck

  freebsd-14-openssl-3:
    needs: ubuntu-latest-html-tests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: FreeBSD VM build
      id: test
      uses: vmactions/freebsd-vm@v1
      with:
        release: "14.0"
        usesh: true
        prepare: |
          set -x
          pkg install -y automake fltk quickjs curl
        run: |
          set -x
          pwd
          freebsd-version
          ./autogen.sh
          ./configure CPPFLAGS='-I/usr/local/include' LDFLAGS='-L/usr/local/lib'
          cat config.log
          make
          make check
          ldd src/dillo

  windows-mbedtls:
    needs: ubuntu-latest-html-tests
    runs-on: windows-latest
    steps:
    - run: git config --global core.autocrlf input
    - uses: actions/checkout@v4
      with:
        fetch-depth: 1
    - uses: cygwin/cygwin-install-action@master
      with:
        packages: gcc-core gcc-g++ autoconf automake make zlib-devel mbedtls-devel libfltk-devel libiconv-devel libpng-devel libjpeg-devel libwebp-devel libgif-devel libbrotli-devel
    - shell: C:\cygwin\bin\bash.exe --login --norc -eo pipefail -o igncr '{0}'
      run: |
        set -x
        cd ${GITHUB_WORKSPACE}
        pwd
        ls -l
        ./autogen.sh
        ./configure
        make
        make check
        ls -l src/dillo
